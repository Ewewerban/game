<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blitz FPS — Arena</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050508;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      background-color: #ffee00;
      border: 1px solid #000;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 6px rgba(255, 238, 0, 0.8);
    }

    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .hud-box {
      background: rgba(12, 12, 15, 0.85);
      border: 1px solid #1f1f26;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .hud-value {
      color: #ffee00;
      font-size: 1.2rem;
    }

    #weapon-hud {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(12, 12, 15, 0.85);
      border: 1px solid #1f1f26;
      padding: 15px 20px;
      border-radius: 12px;
      pointer-events: none;
      text-align: right;
    }

    .weapon-name {
      color: #ffee00;
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .weapon-hint {
      color: #72767d;
      font-size: 0.8rem;
    }

    #instructions {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 5, 8, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 10;
      cursor: pointer;
    }

    #instructions h1 {
      color: #ffee00;
      font-size: 2.8rem;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(255, 238, 0, 0.3);
    }

    #instructions p {
      color: #8e8e93;
      font-size: 1.1rem;
      max-width: 500px;
      line-height: 1.6;
    }

    .btn-start {
      margin-top: 25px;
      background: #ffee00;
      color: #000;
      border: none;
      padding: 14px 35px;
      font-weight: bold;
      font-size: 1.05rem;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 238, 0, 0.3);
      transition: all 0.2s;
    }

    .btn-start:hover {
      background: #ffcc00;
      transform: scale(1.05);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="instructions">
    <h1>⚡ BLITZ FPS</h1>
    <p>
      <b>Sterowanie:</b> W, A, S, D (Ruch) | Mysz (Rozglądanie) | Spacja (Skok)<br>
      <b>Bronie:</b> Klawisze <b>[1]</b> Pulse Rifle | <b>[2]</b> Shotgun | <b>[3]</b> Railgun<br>
      Kliknij, aby wejść na arenę!
    </p>
    <button class="btn-start">ROZPOCZNIJ WALKĘ</button>
  </div>

  <div id="crosshair"></div>

  <div id="hud">
    <div class="hud-box">WYNIK: <span class="hud-value" id="scoreVal">0</span></div>
    <div class="hud-box">ZDROWIE: <span class="hud-value" id="hpVal">100</span> HP</div>
  </div>

  <div id="weapon-hud">
    <div class="weapon-name" id="weaponNameVal">1. Pulse Rifle</div>
    <div class="weapon-hint">Przełącz: [1] [2] [3]</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    let camera, scene, renderer;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    let prevTime = performance.now();

    let score = 0;
    let playerHp = 100;
    let bots = [];
    const raycaster = new THREE.Raycaster();

    const weapons = [
      { name: "1. Pulse Rifle", damage: 35, fireRate: 150, spread: 0.01, pellets: 1 },
      { name: "2. Plasma Shotgun", damage: 18, fireRate: 500, spread: 0.06, pellets: 6 },
      { name: "3. Railgun", damage: 100, fireRate: 900, spread: 0.001, pellets: 1 }
    ];
    let currentWeaponIdx = 0;
    let lastShotTime = 0;

    const instructions = document.getElementById('instructions');

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060609);
      scene.fog = new THREE.FogExp2(0x060609, 0.018);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.y = 2;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffee00, 0.7);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      const floorGeometry = new THREE.PlaneGeometry(160, 160, 30, 30);
      floorGeometry.rotateX(-Math.PI / 2);
      const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x0f0f14, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeometry, floorMaterial);
      scene.add(floor);

      const gridHelper = new THREE.GridHelper(160, 40, 0xffee00, 0x1f1f2b);
      gridHelper.position.y = 0.01;
      scene.add(gridHelper);

      const boxGeo = new THREE.BoxGeometry(4, 9, 4);
      const boxMat = new THREE.MeshStandardMaterial({ color: 0x161620, roughness: 0.5 });
      
      for (let i = 0; i < 22; i++) {
        const mesh = new THREE.Mesh(boxGeo, boxMat);
        mesh.position.x = (Math.random() - 0.5) * 110;
        mesh.position.y = 4.5;
        mesh.position.z = (Math.random() - 0.5) * 110;
        scene.add(mesh);
      }

      spawnBots();

      instructions.addEventListener('click', () => {
        document.body.requestPointerLock();
      });

      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
          instructions.style.display = 'none';
        } else {
          instructions.style.display = 'flex';
        }
      });

      document.addEventListener('mousemove', (event) => {
        if (document.pointerLockElement !== document.body) return;
        const movementX = event.movementX || event.mozMovementX || 0;
        const movementY = event.movementY || event.mozMovementY || 0;

        camera.rotation.y -= movementX * 0.002;
        const pitch = camera.rotation.x + movementY * 0.002;
        camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
      });

      document.addEventListener('mousedown', (e) => {
        if (document.pointerLockElement !== document.body || e.button !== 0) return;
        tryShoot();
      });

      document.addEventListener('keydown', (e) => {
        switch (e.code) {
          case 'KeyW': moveForward = true; break;
          case 'KeyS': moveBackward = true; break;
          case 'KeyA': moveLeft = true; break;
          case 'KeyD': moveRight = true; break;
          case 'Space':
            if (canJump) velocity.y += 7;
            canJump = false;
            break;
          case 'Digit1': switchWeapon(0); break;
          case 'Digit2': switchWeapon(1); break;
          case 'Digit3': switchWeapon(2); break;
        }
      });

      document.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'KeyW': moveForward = false; break;
          case 'KeyS': moveBackward = false; break;
          case 'KeyA': moveLeft = false; break;
          case 'KeyD': moveRight = false; break;
        }
      });

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      window.addEventListener('resize', onWindowResize);
    }

    function switchWeapon(idx) {
      currentWeaponIdx = idx;
      document.getElementById('weaponNameVal').innerText = weapons[idx].name;
    }

    function spawnBots() {
      const botGeo = new THREE.BoxGeometry(2, 3.5, 2);
      const botMat = new THREE.MeshStandardMaterial({ color: 0xff3355, emissive: 0x400a12 });

      for (let i = 0; i < 8; i++) {
        const bot = new THREE.Mesh(botGeo, botMat);
        resetBot(bot);
        scene.add(bot);
        bots.push(bot);
      }
    }

    function resetBot(bot) {
      bot.position.x = (Math.random() - 0.5) * 120;
      bot.position.y = 1.75;
      bot.position.z = (Math.random() - 0.5) * 120;
      bot.userData = { health: 60, speed: 0.025 + Math.random() * 0.015 };
    }

    function tryShoot() {
      const now = performance.now();
      const weapon = weapons[currentWeaponIdx];
      if (now - lastShotTime < weapon.fireRate) return;
      lastShotTime = now;

      for (let p = 0; p < weapon.pellets; p++) {
        const spreadX = (Math.random() - 0.5) * weapon.spread;
        const spreadY = (Math.random() - 0.5) * weapon.spread;
        
        raycaster.setFromCamera(new THREE.Vector2(spreadX, spreadY), camera);
        const intersects = raycaster.intersectObjects(bots);

        if (intersects.length > 0) {
          const hitBot = intersects[0].object;
          hitBot.userData.health -= weapon.damage;

          if (hitBot.userData.health <= 0) {
            score += 25;
            document.getElementById('scoreVal').innerText = score;
            resetBot(hitBot);
          }
          break;
        }
      }
    }

    function updateBots() {
      bots.forEach(bot => {
        const dir = new THREE.Vector3().subVectors(camera.position, bot.position);
        dir.y = 0;
        dir.normalize();
        bot.position.addScaledVector(dir, bot.userData.speed);
        bot.lookAt(camera.position.x, bot.position.y, camera.position.z);

        if (bot.position.distanceTo(camera.position) < 2.2) {
          playerHp -= 0.25;
          document.getElementById('hpVal').innerText = Math.max(0, Math.floor(playerHp));
          if (playerHp <= 0) {
            alert("Koniec gry! Twój wynik: " + score);
            location.reload();
          }
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;

      velocity.x -= velocity.x * 14.0 * delta;
      velocity.z -= velocity.z * 14.0 * delta;
      velocity.y -= 9.8 * 20.0 * delta;

      direction.z = Number(moveForward) - Number(moveBackward);
      // POPRAWIONY KIERUNEK RUCHU BOKIEM (A w lewo, D w prawo)
      direction.x = Number(moveLeft) - Number(moveRight);
      direction.normalize();

      if (moveForward || moveBackward) velocity.z -= direction.z * 220.0 * delta;
      if (moveLeft || moveRight) velocity.x -= direction.x * 220.0 * delta;

      camera.translateX(velocity.x * delta);
      camera.translateZ(velocity.z * delta);
      camera.position.y += (velocity.y * delta);

      if (camera.position.y < 2) {
        velocity.y = 0;
        camera.position.y = 2;
        canJump = true;
      }

      updateBots();

      prevTime = time;
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
