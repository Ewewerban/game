<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Duck Hunt</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0b0e;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    h1 {
      color: #f3e600;
      margin-bottom: 10px;
      font-size: 1.8rem;
      text-shadow: 2px 2px #ff0000;
    }

    #game-container {
      position: relative;
      border: 4px solid #f3e600;
      box-shadow: 0 0 20px rgba(243, 230, 0, 0.3);
    }

    canvas {
      display: block;
      background: linear-gradient(to bottom, #5c94fc 0%, #5c94fc 70%, #d88000 70%, #8b4513 100%);
      cursor: crosshair;
    }

    .hud {
      margin-top: 12px;
      display: flex;
      gap: 30px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .hud span {
      color: #f3e600;
    }
  </style>
</head>
<body>

  <h1>🦆 RETRO DUCK HUNT 🦆</h1>

  <div id="game-container">
    <canvas id="canvas" width="800" height="500"></canvas>
  </div>

  <div class="hud">
    <div>WYNIK: <span id="scoreVal">0</span></div>
    <div>TRAFIONE KACZKI: <span id="ducksVal">0</span></div>
    <div>NABOJE: <span id="ammoVal">3</span></div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let ducksHitCount = 0;
    let ammo = 3;

    // Stan kaczki
    let duck = {
      x: 100,
      y: 350,
      radius: 25,
      speedX: 3,
      speedY: -2.5,
      isAlive: true,
      isFalling: false
    };

    function resetDuck() {
      duck.x = Math.random() * (canvas.width - 200) + 100;
      duck.y = 350;
      duck.speedX = (Math.random() - 0.5) * 6;
      duck.speedY = -(Math.random() * 2 + 2);
      duck.isAlive = true;
      duck.isFalling = false;
      ammo = 3;
      updateHUD();
    }

    function updateHUD() {
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('ducksVal').innerText = ducksHitCount;
      document.getElementById('ammoVal').innerText = ammo;
    }

    // Strzał / Kliknięcie myszką
    canvas.addEventListener('click', (e) => {
      if (!duck.isAlive || ammo <= 0) return;

      ammo--;
      updateHUD();

      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      // Sprawdzenie trafienia w kaczkę
      const dist = Math.hypot(mouseX - duck.x, mouseY - duck.y);
      if (dist < duck.radius + 10) {
        duck.isFalling = true;
        duck.isAlive = false;
        score += 100;
        ducksHitCount++;
        updateHUD();

        setTimeout(() => {
          resetDuck();
        }, 1500);
      } else if (ammo === 0) {
        // Koniec naboi - kaczka ucieka
        setTimeout(() => {
          resetDuck();
        }, 1200);
      }
    });

    // Pętla gry
    function update() {
      if (duck.isAlive) {
        duck.x += duck.speedX;
        duck.y += duck.speedY;

        // Odbicia od krawędzi ekranu
        if (duck.x < 30 || duck.x > canvas.width - 30) {
          duck.speedX *= -1;
        }
        if (duck.y < 50) {
          duck.speedY *= -1;
        }
        // Jeśli kaczka ucieknie do dołu
        if (duck.y > 380) {
          resetDuck();
        }
      } else if (duck.isFalling) {
        duck.y += 6; // Spadanie po trafieniu
        if (duck.y > 380) {
          duck.y = 380;
        }
      }
    }

    function drawDuck() {
      ctx.save();
      // Tułów kaczki (brązowy elipsa)
      ctx.fillStyle = duck.isAlive ? '#8B4513' : '#555';
      ctx.beginPath();
      ctx.ellipse(duck.x, duck.y, 22, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      // Głowa kaczki (zielona/ciemna)
      ctx.fillStyle = duck.isAlive ? '#228B22' : '#444';
      ctx.beginPath();
      ctx.arc(duck.x + (duck.speedX > 0 ? 16 : -16), duck.y - 10, 10, 0, Math.PI * 2);
      ctx.fill();

      // Dziób
      ctx.fillStyle = '#FFA500';
      ctx.beginPath();
      let beakX = duck.x + (duck.speedX > 0 ? 24 : -32);
      ctx.rect(beakX, duck.y - 13, 8, 5);
      ctx.fill();

      ctx.restore();
    }

    function drawScene() {
      // Czyszczenie tła
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Słońce w tle
      ctx.fillStyle = '#fffa65';
      ctx.beginPath();
      ctx.arc(700, 90, 35, 0, Math.PI * 2);
      ctx.fill();

      // Krzaki na horyzoncie
      ctx.fillStyle = '#2d6a4f';
      ctx.beginPath();
      ctx.arc(150, 350, 60, Math.PI, 0, false);
      ctx.arc(230, 350, 50, Math.PI, 0, false);
      ctx.arc(600, 350, 70, Math.PI, 0, false);
      ctx.fill();

      // Rysowanie kaczki
      drawDuck();

      // Komunikat o braku amunicji
      if (ammo === 0 && !duck.isFalling) {
        ctx.fillStyle = '#ff3333';
        ctx.font = 'bold 28px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('UCIECZKA!', canvas.width / 2, 100);
      }
    }

    function loop() {
      update();
      drawScene();
      requestAnimationFrame(loop);
    }

    resetDuck();
    loop();
  </script>
</body>
</html>
